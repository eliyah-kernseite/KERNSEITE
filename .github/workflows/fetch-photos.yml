name: Fetch photos (temporär)
on:
  push:
    branches: [claude/kernseite-feinschliff]
    paths: [assets-source/neu/fetch-list.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          while read -r name id; do
            [ -z "$name" ] && continue
            ua="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
            # Bildadresse aus der Fotoseite lesen (og:image), dann in voller Größe laden.
            img=$(curl -fsSL -A "$ua" "https://unsplash.com/photos/$id" | grep -o 'https://images.unsplash.com/photo-[0-9a-z-]*' | head -1)
            echo "$name $id -> $img"
            [ -n "$img" ] && curl -fsSL -A "$ua" "$img?fm=jpg&q=85&w=2400" -o "assets-source/neu/$name.jpg" || echo "FAILED $name"
          done < assets-source/neu/fetch-list.txt
          ls -la assets-source/neu
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets-source/neu/ || true
          git commit -m "Fotos von Unsplash geladen" || true
          git push
